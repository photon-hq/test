name: Private Workflow Call

# Tests whether a PUBLIC repo (photon-hq/test) can `uses:` a reusable
# workflow that lives in an INTERNAL/PRIVATE repo
# (photon-hq/buildspace-private).
#
# If the called repo doesn't allow access from this repo, the dispatch
# fails at parse time with:
#   "workflow was not found"
# Fix is on the called repo's side:
#   Settings -> Actions -> General -> "Access" ->
#     "Accessible from repositories owned by 'photon-hq'"
#   (and for public callers, also tick "...including public repositories").

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-workflow-call.yaml'
      - 'probe.txt'
  workflow_dispatch:

jobs:
  call-private-workflow:
    name: Call typescript-service-release from buildspace-private
    uses: photon-hq/buildspace-private/.github/workflows/typescript-service-release.yaml@main
    with:
      service-name: test
      working-directory: .
      build-command: "echo build"
      publish-command: "echo publish"
      dry-run: true
    secrets: inherit
