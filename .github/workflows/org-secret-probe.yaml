name: Org Secret Probe

# Tests whether a PUBLIC repo (photon-hq/test) can read organization-level
# secrets that were configured on the photon-hq org.
#
# Run via the Actions tab -> "Org Secret Probe" -> Run workflow,
# or `gh workflow run org-secret-probe.yaml --repo photon-hq/test`.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  org-secret-access:
    name: Read org secrets from public repo
    runs-on: ubuntu-latest
    steps:
      - name: Probe OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY org secret is NOT visible to this public repo."
            exit 1
          fi
          echo "OPENAI_API_KEY is visible (length=${#OPENAI_API_KEY})."

      - name: Probe APP_ID / APP_PRIVATE_KEY
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -z "${APP_ID}" ]          && missing+=("APP_ID")
          [ -z "${APP_PRIVATE_KEY}" ] && missing+=("APP_PRIVATE_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing org secrets in public repo: ${missing[*]}"
            exit 1
          fi
          echo "APP_ID visible (length=${#APP_ID}), APP_PRIVATE_KEY visible (length=${#APP_PRIVATE_KEY})."

      - name: Probe ANTHROPIC_API_KEY / NPM_TOKEN
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NPM_TOKEN:         ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "${ANTHROPIC_API_KEY}" ] && echo "ANTHROPIC_API_KEY visible (length=${#ANTHROPIC_API_KEY})." || echo "ANTHROPIC_API_KEY NOT visible."
          [ -n "${NPM_TOKEN}" ]         && echo "NPM_TOKEN visible (length=${#NPM_TOKEN})."                 || echo "NPM_TOKEN NOT visible."
